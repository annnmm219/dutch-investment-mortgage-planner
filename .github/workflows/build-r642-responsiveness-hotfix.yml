name: Build R6.4.2 responsiveness hotfix

on:
  push:
    branches:
      - r6-4-1-responsiveness-hotfix

permissions:
  contents: write

jobs:
  build-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply responsiveness patch
        run: python3 scripts/apply-r642-responsiveness-hotfix.py
      - name: Run complete regression suite
        run: npm test
      - name: Re-run 50-scenario reconciliation
        run: npm run verify:50
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real-browser responsiveness smoke test
        run: node scripts/browser-responsiveness-smoke.mjs
      - name: Commit verified hotfix sources
        shell: bash
        run: |
          rm -f scripts/apply-r642-responsiveness-hotfix.py
          rm -f .github/workflows/build-r642-responsiveness-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R6.4.2 prevent browser observer loop"
          git push origin HEAD:r6-4-1-responsiveness-hotfix
