name: Stage 10 ledger hotfix
on:
  push:
    branches: [r6-6-decision-integrity]
    paths: ['.github/workflows/stage10-ledger-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r6-6-decision-integrity
          fetch-depth: 0
      - name: Patch Stage 9.1 ledger bridge for Stage 10 property return evidence
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='stage9-1-remediation.js';
          let s=fs.readFileSync(p,'utf8');
          const old='method:canSettle?taxResult.method:`unsettled estimate · ${taxResult.method}`,notionalTax:taxResult.notionalTax,actualTax:taxResult.actualTax,taxPaidFromSavings:paid.fromSavings,taxPaidFromPortfolio:paid.fromPortfolio,externalTax:paid.external};';
          const next='method:canSettle?taxResult.method:`unsettled estimate · ${taxResult.method}`,notionalTax:taxResult.notionalTax,actualTax:taxResult.actualTax,propertyRentalIncome:nonNegative(taxResult.propertyRentalIncome),propertyOwnUseAddition:nonNegative(taxResult.propertyOwnUseAddition),propertyDirectReturn:nonNegative(taxResult.propertyDirectReturn),taxPaidFromSavings:paid.fromSavings,taxPaidFromPortfolio:paid.fromPortfolio,externalTax:paid.external};';
          if(!s.includes(old)) throw new Error('Stage 9.1 year-bucket target not found');
          fs.writeFileSync(p,s.replace(old,next));
          NODE
          rm .github/workflows/stage10-ledger-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage9-1-remediation.js .github/workflows/stage10-ledger-hotfix.yml
          git commit -m "Stage 10: expose property direct return in audit ledger"
          git push origin HEAD:r6-6-decision-integrity