name: Browser responsiveness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser contracts
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee browser-test.log
      - name: Retain browser transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage91-browser-test-${{ github.sha }}
          path: browser-test.log
          if-no-files-found: error
          retention-days: 14
