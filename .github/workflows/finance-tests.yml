name: Finance regression tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pinned dependencies
        run: npm ci
      - name: Install Chromium for the screen tests
        run: npx playwright install --with-deps chromium
      - name: Run finance regression tests
        run: npm test

  release-stamp-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fail a main release while the patch date is null
        run: node scripts/release-stamp-guard.js
