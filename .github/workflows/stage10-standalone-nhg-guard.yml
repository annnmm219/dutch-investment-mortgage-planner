name: Stage 10 standalone NHG guard

on:
  push:
    branches: [r6-6-decision-integrity]
    paths:
      - '.github/workflows/stage10-standalone-nhg-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r6-6-decision-integrity
          fetch-depth: 0
      - name: Close standalone NHG hidden-input fallback
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replace(s,from,to,label){if(!s.includes(from))throw new Error(`Missing anchor: ${label}`);return s.replace(from,to);}
          let s=fs.readFileSync('stage10-remediation.js','utf8');
          s=replace(s,"  if(finiteOrNull(input.nhgNonEnergyCostStack)!==null)return prior(input);\n",'', 'remove exact-stack bypass');
          s=replace(s,"warning:'Exact NHG eligibility requires the official non-energy cost stack (items a–g) and, for the enhanced route, qualifying energy expenditure. Use the Scenario purchase-rule section for this exact check.'","warning:'Standalone Mortgage-tab NHG is intentionally unavailable in R6.6, even if hidden cost-stack inputs are supplied. Use the Scenario purchase-rule section for the exact existing-home NHG check.'",'standalone warning');
          fs.writeFileSync('stage10-remediation.js',s);

          let t=fs.readFileSync('tests/r66-stage10-remediation.test.js','utf8');
          t += `\n\ntest('F-03 standalone NHG cannot regain eligibility through hidden exact-stack input',()=>{\n  const prior=input=>({input,nhg:{enabled:false,eligible:false,fee:0},nhgFee:0});\n  const x=S10.unsupportedStandaloneNhg(prior,{nhgMode:'standard',nhgNonEnergyCostStack:400000});\n  assert.equal(x.nhg.enabled,true);\n  assert.equal(x.nhg.eligible,false);\n  assert.equal(x.nhg.fee,0);\n  assert.equal(x.nhgFee,0);\n  assert.match(x.nhg.warning,/intentionally unavailable|Scenario purchase-rule/i);\n});\n`;
          fs.writeFileSync('tests/r66-stage10-remediation.test.js',t);
          NODE
          rm .github/workflows/stage10-standalone-nhg-guard.yml
          git config user.name "annnmm219"
          git config user.email "theahnl09@gmail.com"
          git add stage10-remediation.js tests/r66-stage10-remediation.test.js .github/workflows/stage10-standalone-nhg-guard.yml
          git commit -m "Stage 10: make standalone NHG fail-safe for hidden inputs"
          git push origin HEAD:r6-6-decision-integrity
