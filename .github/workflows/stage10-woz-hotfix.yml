name: Stage 10 WOZ hotfix
on:
  push:
    branches: [r6-6-decision-integrity]
    paths: ['.github/workflows/stage10-woz-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r6-6-decision-integrity
          fetch-depth: 0
      - name: Patch Stage 10 private-use WOZ visibility
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='stage10-remediation.js';
          let s=fs.readFileSync(p,'utf8');
          const old="const priorWoz=$('scenarioPropertyPrivateUseWozNew'),days=nonNegative($('scenarioPropertyPrivateUseDaysNew')?.value);if(priorWoz)priorWoz.required=purchase&&nonMain&&box3==='current'&&days>0;const warning=$('scenarioNonMainFutureWarning');";
          const next="const priorWoz=$('scenarioPropertyPrivateUseWozNew'),days=nonNegative($('scenarioPropertyPrivateUseDaysNew')?.value),priorWozField=$('scenarioPropertyPrivateUseWozField');if(priorWozField)priorWozField.classList.toggle('hidden',!(purchase&&nonMain&&box3==='current'&&days>0));if(priorWoz){priorWoz.required=purchase&&nonMain&&box3==='current'&&days>0;if(days<=0)priorWoz.value='0';}const warning=$('scenarioNonMainFutureWarning');";
          if(!s.includes(old)) throw new Error('Stage 10 WOZ sync target not found');
          s=s.replace(old,next);
          fs.writeFileSync(p,s);
          NODE
          rm .github/workflows/stage10-woz-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage10-remediation.js .github/workflows/stage10-woz-hotfix.yml
          git commit -m "Stage 10: hide inactive private-use WOZ input"
          git push origin HEAD:r6-6-decision-integrity