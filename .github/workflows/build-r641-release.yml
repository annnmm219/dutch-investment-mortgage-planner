name: Build R6.4.1 release

on:
  push:
    branches:
      - r6-4-1-release

permissions:
  contents: write

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply deterministic source patch
        run: python3 scripts/apply-r641-source-patch.py
      - name: Run complete regression suite
        run: npm test
      - name: Run 50-scenario reconciliation matrix
        run: npm run verify:50
      - name: Commit verified release sources
        shell: bash
        run: |
          rm -f scripts/apply-r641-source-patch.py
          rm -f .github/workflows/build-r641-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R6.4.1 output integrity and 50-scenario reconciliation"
          git push origin HEAD:r6-4-1-release
