name: Build R6.5 interface simplification

on:
  push:
    branches:
      - r6-5-interface-simplification
    paths:
      - scripts/apply-r65-interface-simplification.py

permissions:
  contents: write

jobs:
  build-interface:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply R6.5 release patch
        run: python3 scripts/apply-r65-interface-simplification.py

      - name: Run complete regression suite
        run: npm test

      - name: Re-run 50-scenario reconciliation
        run: npm run verify:50

      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-browser interface test
        run: node scripts/browser-responsiveness-smoke.mjs

      - name: Commit verified R6.5 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No tracked source changes to commit."
          else
            git commit -m "R6.5 simplify the interface before final audit"
            git push origin HEAD:r6-5-interface-simplification
          fi
