name: Apply staged R6.4.1 patch

on:
  push:
    branches:
      - r6-4-1-output-integrity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Decode and inspect patch
        shell: bash
        run: |
          cat R6_4_1.patch.part* | tr -d '\n\r' | base64 --decode | gzip --decompress > /tmp/R6_4_1.patch
          echo "Decoded patch size: $(wc -c < /tmp/R6_4_1.patch) bytes"
          sed -n '1,80p' /tmp/R6_4_1.patch
          git apply --check /tmp/R6_4_1.patch
      - name: Apply patch and remove staging files
        shell: bash
        run: |
          git apply /tmp/R6_4_1.patch
          rm -f R6_4_1.patch.part*
          rm -f .github/workflows/apply-r641-staged-patch.yml
      - name: Run complete regression suite
        run: npm test
      - name: Commit applied release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R6.4.1 output integrity and scenario verification"
          git push origin HEAD:r6-4-1-output-integrity
