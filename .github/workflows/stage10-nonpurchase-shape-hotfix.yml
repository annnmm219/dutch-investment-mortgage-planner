name: Stage 10 nonpurchase shape hotfix
on:
  push:
    branches: [r6-6-decision-integrity]
    paths: ['.github/workflows/stage10-nonpurchase-shape-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r6-6-decision-integrity
          fetch-depth: 0
      - name: Normalize inactive Stage 10 purchase fields
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='stage10-remediation.js';
          let s=fs.readFileSync(p,'utf8');
          const old="    resolved.purchaseRules=rules;return resolved;";
          const next="    if(!isPurchase(resolved.mode)){rules.propertyUse='main-residence';rules.deductibleFinancingCosts=0;rules.nhgNonEnergyCostStack=null;rules.grossRentalIncomeAnnual=0;rules.privateUseDays=0;rules.privateUseWozValue=0;rules.propertyIncomeGrowthPct=0;}\n    resolved.purchaseRules=rules;return resolved;";
          if(!s.includes(old)) throw new Error('Stage 10 resolver return target not found');
          fs.writeFileSync(p,s.replace(old,next));
          NODE
          rm .github/workflows/stage10-nonpurchase-shape-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stage10-remediation.js .github/workflows/stage10-nonpurchase-shape-hotfix.yml
          git commit -m "Stage 10: stabilize inactive purchase-rule config"
          git push origin HEAD:r6-6-decision-integrity