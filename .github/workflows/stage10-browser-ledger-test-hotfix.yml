name: Stage 10 browser ledger test hotfix
on:
  push:
    branches: [r6-6-decision-integrity]
    paths: ['.github/workflows/stage10-browser-ledger-test-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: r6-6-decision-integrity
          fetch-depth: 0
      - name: Read property evidence from annual audit buckets
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/stage10-browser-parity.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old="      assert.ok((imported.ledgers[0]?.propertyRentalIncome||0)>0,`${label}: rental income absent from property ledger`);\n      assert.ok((imported.ledgers[0]?.propertyOwnUseAddition||0)>0,`${label}: own-use addition absent from property ledger`);";
          const next="      const propertyLedger=imported.ledgers.find(x=>x?.nonMainPropertyBox3)||imported.ledgers[0],propertyBuckets=Object.values(propertyLedger?.yearBuckets||{});\n      assert.ok(propertyBuckets.some(x=>(x?.propertyRentalIncome||0)>0),`${label}: rental income absent from property ledger`);\n      assert.ok(propertyBuckets.some(x=>(x?.propertyOwnUseAddition||0)>0),`${label}: own-use addition absent from property ledger`);";
          if(!s.includes(old)) throw new Error('Stage 10 browser property assertion target not found');
          fs.writeFileSync(p,s.replace(old,next));
          NODE
          rm .github/workflows/stage10-browser-ledger-test-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/stage10-browser-parity.mjs .github/workflows/stage10-browser-ledger-test-hotfix.yml
          git commit -m "Stage 10: read property return evidence from annual ledger"
          git push origin HEAD:r6-6-decision-integrity